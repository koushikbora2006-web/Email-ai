<!-- Top Header Bar -->
<header class="app-header">
    <div class="header-left">
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Toggle Sidebar" aria-label="Toggle Sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <div class="brand-title">
            <span class="brand-icon">✨</span>
            <span class="brand-text">Email Writer AI</span>
        </div>
    </div>
    <div class="header-right">
        <a href="#support" class="nav-link-item" id="support-link">Support</a>
        <div class="user-profile-widget" id="header-profile-widget">
            <img id="header-profile-pic" class="header-profile-pic" src="/api/user/profile-pic" alt="Profile">
            <span class="user-email-display" id="user-email-tag">{{ user_email }}</span>
        </div>
        <a href="/api/auth/logout" class="btn-signout">Sign out</a>
    </div>
</header>
